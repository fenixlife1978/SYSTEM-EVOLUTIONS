name: Build Windows (.exe)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar dependencias nativas para Electron
        run: npx electron-builder install-app-deps

      # ─── INSTALADOR COMPLETO (NSIS) ───
      - name: Generar demo.json (versión completa)
        run: node -e "require('fs').writeFileSync('pos-system/demo.json','{\"demo\":false}')"

      - name: Generar instalador completo (.exe NSIS)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Subir instalador completo
        uses: actions/upload-artifact@v4
        with:
          name: POSsystem-Evolution-Installer
          path: dist/*.exe
          if-no-files-found: error

      # ─── VERSIÓN DEMO (PORTABLE) ───
      - name: Limpiar dist para segundo build
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

      - name: Generar demo.json (versión demo)
        run: node -e "require('fs').writeFileSync('pos-system/demo.json','{\"demo\":true}')"

      - name: Generar Demo portable (.exe)
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Subir Demo portable
        uses: actions/upload-artifact@v4
        with:
          name: POSsystem-Evolution-Demo
          path: dist/*demo*.exe
          if-no-files-found: error
